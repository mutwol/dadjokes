    <!-- Apply the saved or system theme before first paint (see src/theme/theme.ts). -->
    <script>
      (function () {
        var p = null;
        try { p = localStorage.getItem("daddyjokes.theme"); } catch (e) {}
        var dark = p === "dark" || (p !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <title>Daddy Jokes: one dad joke a day, delivered like a status</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
