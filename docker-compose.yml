# Local services for the API. Start with `pnpm db:up` (or `docker compose up -d`).
# On every start, the `migrate` service applies database migrations and loads
# development data, including test jokes, then exits.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: daddy
      POSTGRES_PASSWORD: daddy
      POSTGRES_DB: daddy_jokes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daddy -d daddy_jokes"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Catches outgoing email in development. Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # Applies migrations, then seeds topics, writers, sample readers and test
  # jokes around today. Safe to repeat. Rebuilt on each start, so new migrations
  # and seed changes are picked up. Skip the seed with SEED=false.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: daddy-jokes-api
    pull_policy: build
    command: ["sh", "-c", "node dist/db/migrate.js && if [ \"$$SEED\" != false ]; then node dist/db/seed.js; fi"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://daddy:daddy@postgres:5432/daddy_jokes
      SEED: ${SEED:-true}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
