# Local services for the API. Start with `pnpm db:up`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: daddy
      POSTGRES_PASSWORD: daddy
      POSTGRES_DB: daddy_jokes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daddy -d daddy_jokes"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Catches outgoing email in development. Inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
